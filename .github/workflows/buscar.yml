name: Buscar vuelos

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (UTC): 21, 3, 9 y 15 hs de Argentina
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar mail de prueba con los precios de ahora'
        type: boolean
        default: false
      solo:
        description: 'Solo estas webs, separadas por coma (para pruebas)'
        type: string
        default: ''
      fechas:
        description: 'Solo estas fechas, ida:vuelta separadas por coma (para pruebas)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node buscar.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUEBA: ${{ inputs.prueba && '1' || '0' }}
          SOLO: ${{ inputs.solo }}
          FECHAS: ${{ inputs.fechas }}
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "buscador-vuelos"
          git config user.email "actions@users.noreply.github.com"
          git add historial.csv estado.json docs/datos.json
          git commit -m "Búsqueda $(date -u +%F' '%H:%M)" || echo "sin cambios"
          git push
